# Tiny Tapeout project information
project:
  title:        "risk_trade — Fault-Tolerant Pre-Trade Risk Engine"
  author:       "Denis Brown"
  discord:      ""
  description:  "TMR-protected pre-trade risk decision core with price collar and velocity checks"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x1"

  top_module:  "tt_um_risk_trade"

  source_files:
    - "tt_um_risk_trade.v"
    - "risk_core_check.v"
    - "risk_engine.v"
    - "tmr_voter.v"

pinout:
  # Inputs
  ui[0]: "DATA[0] - price/config byte input"
  ui[1]: "DATA[1] - price/config byte input"
  ui[2]: "DATA[2] - price/config byte input"
  ui[3]: "DATA[3] - price/config byte input"
  ui[4]: "DATA[4] - price/config byte input"
  ui[5]: "DATA[5] - price/config byte input"
  ui[6]: "DATA[6] - price/config byte input"
  ui[7]: "DATA[7] - price/config byte input"

  # Outputs
  uo[0]: "tmr_decision - trade accept/reject"
  uo[1]: "fault_detected - TMR mismatch flag"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "byte_valid - strobe to load DATA byte"
  uio[1]: "is_config - 1=config load, 0=price load"
  uio[2]: "cfg_sel[0] - config register select"
  uio[3]: "cfg_sel[1] - config register select"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6